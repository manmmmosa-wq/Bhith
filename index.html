<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
<meta name="theme-color" content="#4c1d95" />
<title>دليل 2027 — حلب وريفها</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@400;500;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --primary: #4c1d95;
    --primary-light: #7c3aed;
    --gradient: linear-gradient(135deg, #4c1d95, #ec4899);
    --bg: #f8fafc;
    --surface: #ffffff;
    --text: #0f172a;
    --text-muted: #64748b;
    --border: #e2e8f0;
    --radius: 24px;
    --shadow: 0 10px 25px rgba(76, 29, 149, 0.08);
    --shadow-lg: 0 20px 40px rgba(76, 29, 149, 0.15);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Tajawal', sans-serif; }
  
  body {
    background: #e2e8f0;
    display: flex;
    justify-content: center;
    color: var(--text);
    -webkit-font-smoothing: antialiased;
  }

  .app-container {
    width: 100%;
    max-width: 480px;
    background: var(--bg);
    min-height: 100vh;
    position: relative;
    box-shadow: 0 0 40px rgba(0,0,0,0.1);
    overflow-x: hidden;
    padding-bottom: 80px;
  }

  /* ================= الهيدر ================= */
  .app-header {
    background: var(--gradient);
    padding: 30px 20px 70px;
    border-radius: 0 0 40px 40px;
    position: relative;
    color: white;
    overflow: hidden;
  }

  .app-header::before {
    content: ''; position: absolute; top: -50px; right: -50px;
    width: 200px; height: 200px; background: rgba(255,255,255,0.1);
    border-radius: 50%;
  }
  
  .header-top {
    display: flex; justify-content: space-between; align-items: center;
    position: relative; z-index: 2;
  }

  .brand { display: flex; align-items: center; gap: 12px; }
  .app-logo { width: 50px; height: 50px; filter: drop-shadow(0 4px 8px rgba(0,0,0,0.2)); }
  .brand-text h1 { font-size: 22px; font-weight: 800; }
  .brand-text p { font-size: 13px; opacity: 0.9; }

  .search-wrapper {
    position: absolute; bottom: -25px; left: 20px; right: 20px; z-index: 10;
  }
  .search-bar {
    background: var(--surface); border-radius: 20px;
    display: flex; align-items: center; padding: 0 16px;
    height: 56px; box-shadow: var(--shadow-lg);
    border: 1px solid rgba(255,255,255,0.5);
  }
  .search-bar svg { color: var(--text-muted); }
  .search-bar input {
    flex: 1; border: none; outline: none; background: transparent;
    padding: 0 12px; font-size: 15px; font-weight: 500; color: var(--text);
  }

  /* ================= الأقسام والفلترة ================= */
  .app-main { padding: 45px 20px 20px; }
  .section-header {
    display: flex; justify-content: space-between; align-items: center;
    margin: 24px 0 16px;
  }
  .section-header h2 { font-size: 18px; font-weight: 800; }

  .categories-scroll {
    display: flex; gap: 16px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none;
  }
  .categories-scroll::-webkit-scrollbar { display: none; }

  .cat-item { display: flex; flex-direction: column; align-items: center; gap: 8px; cursor: pointer; min-width: 70px; }
  .cat-icon {
    width: 64px; height: 64px; border-radius: 22px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; transition: transform 0.2s, box-shadow 0.2s;
    background: white; box-shadow: 0 4px 10px rgba(0,0,0,0.03);
  }
  .cat-item:active .cat-icon { transform: scale(0.9); }
  .cat-item span { font-size: 13px; font-weight: 700; color: var(--text-muted); }

  /* شريط فلترة المحافظات والمناطق */
  .location-filters {
    display: flex; gap: 10px; margin-bottom: 20px;
  }
  .location-filters select {
    flex: 1; padding: 12px; border-radius: 14px; border: 1.5px solid var(--border);
    background: var(--surface); font-family: inherit; font-weight: 700; color: var(--text);
    outline: none; box-shadow: var(--shadow); cursor: pointer;
    appearance: none; background-image: url("data:image/svg+xml;charset=US-ASCII,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20width%3D%22292.4%22%20height%3D%22292.4%22%3E%3Cpath%20fill%3D%22%2364748b%22%20d%3D%22M287%2069.4a17.6%2017.6%200%200%200-13-5.4H18.4c-5%200-9.3%201.8-12.9%205.4A17.6%2017.6%200%200%200%200%2082.2c0%205%201.8%209.3%205.4%2012.9l128%20127.9c3.6%203.6%207.8%205.4%2012.8%205.4s9.2-1.8%2012.8-5.4L287%2095c3.5-3.5%205.4-7.8%205.4-12.8%200-5-1.9-9.2-5.5-12.8z%22%2F%3E%3C%2Fsvg%3E");
    background-repeat: no-repeat; background-position: left 12px center; background-size: 10px;
  }

  /* ================= كروت المنشآت ================= */
  .places-list { display: flex; flex-direction: column; gap: 20px; }
  .place-card {
    background: var(--surface); border-radius: var(--radius);
    overflow: hidden; box-shadow: var(--shadow);
    border: 1px solid var(--border); transition: transform 0.2s;
  }
  .place-card:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
  
  .place-img-wrap { position: relative; height: 200px; background: #f1f5f9; }
  .place-img-wrap img { width: 100%; height: 100%; object-fit: cover; }
  
  .place-badges { position: absolute; top: 12px; right: 12px; display: flex; gap: 8px; }
  .badge {
    padding: 6px 12px; border-radius: 10px; font-size: 11px; font-weight: 800;
    backdrop-filter: blur(8px); color: white; box-shadow: 0 2px 8px rgba(0,0,0,0.15);
  }
  .badge-open { background: rgba(16, 185, 129, 0.95); }
  .badge-closed { background: rgba(100, 116, 139, 0.95); }
  .badge-premium { background: rgba(245, 158, 11, 0.95); }

  .place-content { padding: 16px 20px 20px; }
  .place-title-row { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 8px; }
  .place-title { font-size: 18px; font-weight: 800; line-height: 1.3; }
  
  .place-rating {
    display: flex; align-items: center; gap: 4px; background: #fef3c7; color: #d97706;
    padding: 4px 10px; border-radius: 10px; font-weight: 800; font-size: 13px;
  }

  .place-meta {
    display: flex; flex-wrap: wrap; align-items: center; gap: 12px;
    color: var(--text-muted); font-size: 13px; margin-bottom: 12px; font-weight: 500;
  }
  .place-meta span { display: flex; align-items: center; gap: 4px; }

  .place-desc {
    font-size: 14px; color: var(--text-muted); line-height: 1.6; margin-bottom: 16px;
    display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden;
  }

  .place-actions { display: flex; gap: 10px; }
  .btn-wa {
    flex: 1; background: #25d366; color: white; border: none; border-radius: 14px; padding: 12px;
    font-weight: 800; font-size: 14px; display: flex; align-items: center; justify-content: center; gap: 8px;
    text-decoration: none; box-shadow: 0 4px 12px rgba(37, 211, 102, 0.3); transition: 0.2s;
  }
  .btn-wa:hover { background: #1ebe5a; transform: translateY(-2px); }
  
  .btn-call {
    width: 48px; height: 48px; background: #f1f5f9; color: #334155; border: none; border-radius: 14px;
    display: flex; align-items: center; justify-content: center; text-decoration: none; transition: 0.2s;
  }
  .btn-call:hover { background: #e2e8f0; }

  /* ================= الشريط السفلي ================= */
  .bottom-nav {
    position: fixed; bottom: 0; left: 0; right: 0; max-width: 480px; margin: 0 auto;
    background: rgba(255,255,255,0.9); backdrop-filter: blur(15px);
    display: flex; justify-content: space-around; padding: 15px 0;
    border-top: 1px solid var(--border); z-index: 100; border-radius: 24px 24px 0 0;
  }
  .nav-item {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    background: none; border: none; color: var(--text-muted);
    font-size: 12px; font-weight: 700; cursor: pointer; transition: color 0.2s;
  }
  .nav-item svg { width: 24px; height: 24px; stroke: currentColor; fill: none; stroke-width: 2; }
  .nav-item.active { color: var(--primary); }

  /* ================= لوحة التحكم ================= */
  .admin-view { display: none; padding: 20px; }
  .admin-view.active { display: block; animation: slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1); }
  
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }

  .login-wrapper {
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    min-height: 70vh; text-align: center;
  }
  .login-icon {
    width: 80px; height: 80px; background: white; border-radius: 30px;
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-lg); margin-bottom: 20px; font-size: 40px;
  }
  .login-wrapper h2 { font-size: 24px; font-weight: 800; margin-bottom: 8px; }
  .login-wrapper p { color: var(--text-muted); font-size: 14px; margin-bottom: 30px; }
  
  .login-box {
    background: var(--surface); padding: 30px 24px; border-radius: 30px;
    box-shadow: var(--shadow-lg); width: 100%; border: 1px solid var(--border);
  }
  
  .input-group { position: relative; margin-bottom: 20px; }
  .input-group input {
    width: 100%; padding: 16px 20px; border: 2px solid var(--border);
    border-radius: 16px; font-size: 16px; font-weight: 600; outline: none;
    transition: all 0.3s; background: var(--bg); text-align: center; letter-spacing: 2px;
  }
  .input-group input:focus { border-color: var(--primary-light); background: white; box-shadow: 0 0 0 4px rgba(124, 58, 237, 0.1); }
  
  .btn-login {
    width: 100%; background: var(--gradient); color: white; border: none;
    border-radius: 16px; padding: 16px; font-size: 16px; font-weight: 800;
    cursor: pointer; box-shadow: 0 8px 20px rgba(76, 29, 149, 0.3); transition: transform 0.2s;
  }
  .btn-login:active { transform: scale(0.98); }

  .admin-tabs {
    display: flex; background: var(--surface); border-radius: 16px;
    padding: 6px; margin-bottom: 20px; box-shadow: var(--shadow); border: 1px solid var(--border);
    overflow-x: auto; scrollbar-width: none;
  }
  .admin-tabs::-webkit-scrollbar { display: none; }
  .admin-tabs button {
    flex: 1; padding: 12px 16px; border: none; background: none; white-space: nowrap;
    font-weight: 700; color: var(--text-muted); border-radius: 12px;
    cursor: pointer; transition: 0.3s;
  }
  .admin-tabs button.active { background: var(--primary); color: white; box-shadow: 0 4px 10px rgba(76, 29, 149, 0.2); }

  .admin-item {
    display: flex; align-items: center; gap: 12px; background: var(--surface);
    padding: 12px; border-radius: 20px; margin-bottom: 12px;
    box-shadow: var(--shadow); border: 1px solid var(--border);
  }
  .admin-item img { width: 60px; height: 60px; border-radius: 16px; object-fit: cover; }
  .admin-item-info { flex: 1; }
  .admin-item-title { font-weight: 800; font-size: 15px; margin-bottom: 4px; }
  .admin-item-sub { font-size: 12px; color: var(--text-muted); }
  
  .admin-btn-icon {
    width: 40px; height: 40px; border-radius: 12px; border: none;
    display: flex; align-items: center; justify-content: center;
    cursor: pointer; font-size: 18px; transition: 0.2s;
  }
  .admin-btn-icon:hover { transform: scale(1.1); }

  .btn-add {
    background: var(--primary); color: white; padding: 10px 16px; border-radius: 12px;
    font-weight: 700; border: none; cursor: pointer; font-size: 14px;
    display: flex; align-items: center; gap: 6px; box-shadow: 0 4px 10px rgba(76,29,149,0.2);
  }

  .modal {
    position: fixed; inset: 0; background: rgba(15, 23, 42, 0.6);
    backdrop-filter: blur(5px); z-index: 200;
    display: flex; align-items: flex-end; justify-content: center;
    opacity: 0; pointer-events: none; transition: 0.3s;
  }
  .modal.show { opacity: 1; pointer-events: auto; }
  .modal-content {
    background: var(--surface); width: 100%; max-width: 480px;
    border-radius: 30px 30px 0 0; padding: 24px;
    max-height: 90vh; overflow-y: auto; transform: translateY(100%);
    transition: 0.3s cubic-bezier(0.16, 1, 0.3, 1);
  }
  .modal.show .modal-content { transform: translateY(0); }
  
  .form-group { margin-bottom: 16px; }
  .form-group label { display: block; font-size: 13px; font-weight: 700; margin-bottom: 8px; color: var(--text); }
  .form-group input, .form-group select, .form-group textarea {
    width: 100%; padding: 14px; border: 2px solid var(--border);
    border-radius: 14px; background: var(--bg); font-size: 14px; outline: none;
    transition: 0.3s; font-family: inherit;
  }
  .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
    border-color: var(--primary-light); background: white;
  }
  .checkbox-group { display: flex; gap: 16px; margin-top: 10px; }
  .checkbox-group label { display: flex; align-items: center; gap: 8px; font-size: 14px; font-weight: 700; cursor: pointer; }

</style>
</head>
<body>

<div class="app-container">
  
  <!-- ================= الهيدر ================= -->
  <header class="app-header">
    <div class="header-top">
      <div class="brand">
        <svg class="app-logo" viewBox="0 0 100 100" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="100" height="100" rx="28" fill="white" fill-opacity="0.2"/>
          <text x="50" y="68" font-family="Tajawal, sans-serif" font-size="55" font-weight="800" fill="white" text-anchor="middle">د</text>
          <circle cx="75" cy="25" r="12" fill="#fbbf24"/>
        </svg>
        <div class="brand-text">
          <h1>دليل 2027</h1>
          <p>حلب وريفها</p>
        </div>
      </div>
    </div>
    <div class="search-wrapper">
      <div class="search-bar">
        <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="2.5"><circle cx="11" cy="11" r="8"></circle><line x1="21" y1="21" x2="16.65" y2="16.65"></line></svg>
        <input type="text" id="searchInput" placeholder="ابحث عن منشأة، طبيب، مطعم...">
      </div>
    </div>
  </header>

  <!-- ================= المحتوى الرئيسي ================= -->
  <main class="app-main" id="view-home">
    
    <div class="section-header">
      <h2>الأقسام</h2>
    </div>
    <div class="categories-scroll" id="categoriesScroll"></div>

    <div class="section-header">
      <h2>تصفح حسب الموقع</h2>
    </div>
    <div class="location-filters">
      <select id="govFilter"></select>
      <select id="distFilter"></select>
    </div>

    <div class="section-header">
      <h2>أحدث المنشآت</h2>
    </div>
    <div class="places-list" id="placesList"></div>

  </main>

  <!-- ================= لوحة التحكم ================= -->
  <main class="admin-view" id="view-admin">
    
    <div class="login-wrapper" id="adminLogin">
      <div class="login-icon">🔐</div>
      <h2>أهلاً بك في الإدارة</h2>
      <p>أدخل كلمة المرور للوصول إلى لوحة التحكم</p>
      <div class="login-box">
        <div class="input-group">
          <input type="password" id="adminPassInput" placeholder="••••••••" onkeypress="if(event.key==='Enter') loginAdmin()">
        </div>
        <button class="btn-login" onclick="loginAdmin()">تسجيل الدخول</button>
        <p style="text-align:center; margin-top:16px; font-size:12px; color:var(--text-muted);">كلمة المرور: admin2027</p>
      </div>
    </div>

    <div id="adminDashboard" hidden>
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h2 style="font-size:20px; font-weight:800;">لوحة التحكم</h2>
        <button onclick="logoutAdmin()" style="background:#fee2e2; color:#dc2626; border:none; padding:8px 16px; border-radius:12px; font-weight:700; font-size:13px; cursor:pointer;">تسجيل خروج</button>
      </div>

      <div class="admin-tabs">
        <button class="active" data-tab="places" onclick="switchAdminTab('places')">المنشآت</button>
        <button data-tab="locations" onclick="switchAdminTab('locations')">المحافظات والمناطق</button>
        <button data-tab="settings" onclick="switchAdminTab('settings')">الإعدادات</button>
      </div>
      
      <div id="adminContent"></div>
    </div>
  </main>

  <!-- ================= الشريط السفلي ================= -->
  <nav class="bottom-nav">
    <button class="nav-item active" onclick="switchView('home')" id="nav-home">
      <svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
      <span>الرئيسية</span>
    </button>
    <button class="nav-item" onclick="switchView('admin')" id="nav-admin">
      <svg viewBox="0 0 24 24"><path d="M12 20h9"></path><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4L16.5 3.5z"></path></svg>
      <span>الإدارة</span>
    </button>
  </nav>

  <!-- ================= النوافذ المنبثقة ================= -->
  <div class="modal" id="formModal">
    <div class="modal-content">
      <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px;">
        <h3 id="modalTitle" style="font-size:20px; font-weight:800;">إضافة</h3>
        <button onclick="closeModal()" style="background:var(--bg); border:none; width:36px; height:36px; border-radius:50%; font-size:20px; color:var(--text-muted); cursor:pointer;">&times;</button>
      </div>
      <div id="modalBody"></div>
    </div>
  </div>

</div>

<script>
  /* ================= البيانات الافتراضية ================= */
  const DEFAULT_DB = {
    password: 'admin2027',
    categories: [
      { id: 'medical', name: 'طبي', icon: '🩺', color: '#8b5cf6', bg: '#f3e8ff' },
      { id: 'restaurants', name: 'مطاعم', icon: '🍽️', color: '#ea580c', bg: '#ffedd5' },
      { id: 'shops', name: 'محلات', icon: '🛍️', color: '#d97706', bg: '#fef3c7' },
      { id: 'services', name: 'خدمات', icon: '⚙️', color: '#0d9488', bg: '#ccfbf1' },
      { id: 'agriculture', name: 'زراعة', icon: '🌱', color: '#16a34a', bg: '#dcfce7' }
    ],
    // الهيكل الجديد للمحافظات والمناطق
    governorates: [
      { 
        id: 'aleppo', 
        name: 'محافظة حلب', 
        districts: [
          { id: 'aleppo_city', name: 'حلب المدينة' },
          { id: 'jarablus', name: 'ريف جرابلس' },
          { id: 'al_bab', name: 'الباب' },
          { id: 'manbij', name: 'منبج' },
          { id: 'azaz', name: 'أعزاز' },
          { id: 'afrin', name: 'عفرين' },
          { id: 'ghandoura', name: 'الغندورة' },
          { id: 'maskana', name: 'مسكنة' },
          { id: 'deir_hafir', name: 'دير حافر' }
        ]
      }
    ],
    places: [
      { 
        id: 1, name: 'Miss Yalangi', category: 'restaurants', 
        govId: 'aleppo', distId: 'aleppo_city', // ربط المنشأة بالمنطقة
        desc: 'أشهى أنواع المعجنات والحلويات الشرقية، مصنوعة بحب.', 
        image: 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&h=400&fit=crop', 
        rating: 4.8, isOpen: true, premium: true, whatsapp: '963912345678', hours: '9 ص - 11 م' 
      },
      { 
        id: 2, name: 'صيدلية النور', category: 'medical', 
        govId: 'aleppo', distId: 'azaz', 
        desc: 'صيدلية 24 ساعة، تتوفر جميع الأدوية والمستلزمات الطبية.', 
        image: 'https://images.unsplash.com/photo-1587854692152-cbe660dbde88?w=600&h=400&fit=crop', 
        rating: 4.5, isOpen: true, premium: false, whatsapp: '963933445566', hours: '24 ساعة' 
      },
      { 
        id: 3, name: 'مشتل عفرين', category: 'agriculture', 
        govId: 'aleppo', distId: 'afrin', 
        desc: 'شتلات أشجار مثمرة وورد طبيعي، أسعار منافسة للجملة.', 
        image: 'https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=600&h=400&fit=crop', 
        rating: 4.9, isOpen: false, premium: true, whatsapp: '963944556677', hours: '8 ص - 5 م' 
      }
    ]
  };

  /* ================= متغيرات النظام ================= */
  let db = JSON.parse(localStorage.getItem('dalil_db_v8')) || JSON.parse(JSON.stringify(DEFAULT_DB));
  let state = { view: 'home', category: 'all', gov: 'all', dist: 'all', search: '' };
  let editingPlaceId = null;

  function saveDB() { localStorage.setItem('dalil_db_v8', JSON.stringify(db)); }

  // دوال مساعدة لمعرفة الأسماء
  function getGovName(govId) {
    const g = db.governorates.find(x => x.id === govId);
    return g ? g.name : '';
  }
  function getDistName(govId, distId) {
    const g = db.governorates.find(x => x.id === govId);
    if(!g) return '';
    const d = g.districts.find(x => x.id === distId);
    return d ? d.name : '';
  }

  function getImage(p) {
    if (p.image && p.image.trim() !== '') return p.image;
    const defaults = {
      'medical': 'https://images.unsplash.com/photo-1587854692152-cbe660dbde88?w=600&h=400&fit=crop',
      'restaurants': 'https://images.unsplash.com/photo-1517248135467-4c7edcad34c4?w=600&h=400&fit=crop',
      'shops': 'https://images.unsplash.com/photo-1441986300917-64674bd600d8?w=600&h=400&fit=crop',
      'services': 'https://images.unsplash.com/photo-1581092160562-40aa08e78837?w=600&h=400&fit=crop',
      'agriculture': 'https://images.unsplash.com/photo-1416879595882-3373a0480b5b?w=600&h=400&fit=crop'
    };
    return defaults[p.category] || 'https://images.unsplash.com/photo-1519003722824-194d4455a60c?w=600&h=400&fit=crop';
  }

  /* ================= التوجيه ================= */
  function switchView(view) {
    state.view = view;
    document.getElementById('view-home').style.display = view === 'home' ? 'block' : 'none';
    document.getElementById('view-admin').classList.toggle('active', view === 'admin');
    document.getElementById('nav-home').classList.toggle('active', view === 'home');
    document.getElementById('nav-admin').classList.toggle('active', view === 'admin');
    window.scrollTo(0, 0);
  }

  /* ================= واجهة المستخدم (الرئيسية) ================= */
  function renderCategories() {
    const container = document.getElementById('categoriesScroll');
    let html = `
      <div class="cat-item" onclick="filterCat('all')">
        <div class="cat-icon" style="background: ${state.category === 'all' ? '#e0e7ff' : 'white'}; color: ${state.category === 'all' ? '#4f46e5' : '#64748b'}; ${state.category === 'all' ? 'border: 2px solid #6366f1;' : ''}">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"></rect><rect x="14" y="3" width="7" height="7"></rect><rect x="14" y="14" width="7" height="7"></rect><rect x="3" y="14" width="7" height="7"></rect></svg>
        </div>
        <span style="${state.category === 'all' ? 'color:#4f46e5' : ''}">الكل</span>
      </div>
    `;
    html += db.categories.map(c => `
      <div class="cat-item" onclick="filterCat('${c.id}')">
        <div class="cat-icon" style="background: ${c.bg}; color: ${c.color}; ${state.category === c.id ? 'border: 2px solid '+c.color+';' : ''}">
          ${c.icon}
        </div>
        <span style="${state.category === c.id ? 'color:'+c.color : ''}">${c.name}</span>
      </div>
    `).join('');
    container.innerHTML = html;
  }

  // بناء الفلاتر (محافظة -> مناطق)
  function initLocationFilters() {
    const govSelect = document.getElementById('govFilter');
    const distSelect = document.getElementById('distFilter');

    // تعبئة المحافظات
    govSelect.innerHTML = `<option value="all">كل المحافظات</option>` + 
      db.governorates.map(g => `<option value="${g.id}">${g.name}</option>`).join('');
    
    // دالة لتحديث المناطق بناء على المحافظة
    function updateDistricts() {
      const selectedGovId = govSelect.value;
      if (selectedGovId === 'all') {
        distSelect.innerHTML = `<option value="all">كل المناطق</option>`;
        distSelect.disabled = true;
      } else {
        const gov = db.governorates.find(g => g.id === selectedGovId);
        distSelect.innerHTML = `<option value="all">كل مناطق ${gov.name}</option>` + 
          gov.districts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
        distSelect.disabled = false;
      }
    }

    // استدعاء أولي
    updateDistricts();

    // أحداث التغيير
    govSelect.addEventListener('change', () => {
      state.gov = govSelect.value;
      state.dist = 'all'; // تصفير المنطقة
      updateDistricts();
      renderPlaces();
    });

    distSelect.addEventListener('change', () => {
      state.dist = distSelect.value;
      renderPlaces();
    });
  }

  function renderPlaces() {
    const list = document.getElementById('placesList');
    
    let filtered = db.places.filter(p => {
      // فلترة المحافظة والمنطقة
      const matchGov = state.gov === 'all' || p.govId === state.gov;
      const matchDist = state.dist === 'all' || p.distId === state.dist;
      // فلترة التصنيف
      const matchCat = state.category === 'all' || p.category === state.category;
      // البحث
      const matchSearch = p.name.includes(state.search) || p.desc.includes(state.search);
      
      return matchGov && matchDist && matchCat && matchSearch;
    });

    if (filtered.length === 0) {
      list.innerHTML = `<div style="text-align:center; padding:50px 20px; color:var(--text-muted); font-weight:700;">لا توجد نتائج مطابقة</div>`;
      return;
    }

    list.innerHTML = filtered.map(p => {
      const cat = db.categories.find(c => c.id === p.category);
      const distName = getDistName(p.govId, p.distId);
      return `
        <div class="place-card">
          <div class="place-img-wrap">
            <img src="${getImage(p)}" alt="${p.name}" loading="lazy">
            <div class="place-badges">
              ${p.isOpen ? '<span class="badge badge-open">مفتوح الآن</span>' : '<span class="badge badge-closed">مغلق</span>'}
              ${p.premium ? '<span class="badge badge-premium">⭐ مميز</span>' : ''}
            </div>
          </div>
          <div class="place-content">
            <div class="place-title-row">
              <h3 class="place-title">${p.name}</h3>
              <div class="place-rating">
                <svg width="14" height="14" viewBox="0 0 24 24" fill="currentColor"><path d="M12 2l3.09 6.26L22 9.27l-5 4.87 1.18 6.88L12 17.77l-6.18 3.25L7 14.14 2 9.27l6.91-1.01L12 2z"/></svg>
                ${p.rating ? p.rating.toFixed(1) : 'جديد'}
              </div>
            </div>
            <div class="place-meta">
              <span>📍 ${distName}</span>
              <span>${cat ? cat.icon + ' ' + cat.name : ''}</span>
              <span>🕒 ${p.hours}</span>
            </div>
            <p class="place-desc">${p.desc}</p>
            <div class="place-actions">
              <a href="https://wa.me/${p.whatsapp}" target="_blank" class="btn-wa">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M17.5 14.4c-.3-.2-1.7-.8-1.9-.9-.3-.1-.5-.1-.7.2-.2.3-.7.9-.9 1.1-.2.2-.3.2-.6.1-1.5-.7-2.5-1.3-3.5-3-.3-.5.3-.4.8-1.4.1-.2 0-.4 0-.5s-.7-1.6-.9-2.2c-.2-.6-.5-.5-.7-.5h-.6c-.2 0-.5.1-.8.4-.3.3-1 1-1 2.5s1.1 2.9 1.2 3.1c.2.2 2.1 3.2 5.1 4.5 1.8.8 2.5.9 3.4.7.5-.1 1.7-.7 1.9-1.4.2-.7.2-1.2.2-1.4-.1-.1-.3-.2-.6-.3zM12 2C6.5 2 2 6.5 2 12c0 1.8.5 3.4 1.3 4.9L2 22l5.3-1.4c1.4.8 3 1.2 4.7 1.2 5.5 0 10-4.5 10-10S17.5 2 12 2z"/></svg>
                تواصل
              </a>
              <a href="tel:${p.whatsapp}" class="btn-call">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.13.96.36 1.9.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.91.34 1.85.57 2.81.7A2 2 0 0 1 22 16.92z"/></svg>
              </a>
            </div>
          </div>
        </div>
      `;
    }).join('');
  }

  function filterCat(catId) {
    state.category = catId;
    renderCategories();
    renderPlaces();
  }

  document.getElementById('searchInput').addEventListener('input', (e) => {
    state.search = e.target.value;
    renderPlaces();
  });

  /* ================= لوحة التحكم ================= */
  function loginAdmin() {
    const pass = document.getElementById('adminPassInput').value;
    if (pass === db.password) {
      document.getElementById('adminLogin').style.display = 'none';
      document.getElementById('adminDashboard').hidden = false;
      renderAdmin('places');
    } else {
      alert('كلمة المرور غير صحيحة');
    }
  }

  function logoutAdmin() {
    document.getElementById('adminPassInput').value = '';
    document.getElementById('adminLogin').style.display = 'flex';
    document.getElementById('adminDashboard').hidden = true;
  }

  function switchAdminTab(tab) {
    document.querySelectorAll('.admin-tabs button').forEach(b => b.classList.remove('active'));
    document.querySelector(`.admin-tabs button[data-tab="${tab}"]`).classList.add('active');
    renderAdmin(tab);
  }

  function renderAdmin(tab) {
    const container = document.getElementById('adminContent');
    
    // 1. إدارة المنشآت
    if (tab === 'places') {
      container.innerHTML = `
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
          <h3 style="font-size:16px;">قائمة المنشآت (${db.places.length})</h3>
          <button class="btn-add" onclick="openPlaceForm()">+ إضافة</button>
        </div>
        ${db.places.map(p => `
          <div class="admin-item">
            <img src="${getImage(p)}" alt="">
            <div class="admin-item-info">
              <div class="admin-item-title">${p.name}</div>
              <div class="admin-item-sub">${getDistName(p.govId, p.distId)}</div>
            </div>
            <button class="admin-btn-icon" style="background:#e0e7ff; color:#4f46e5;" onclick="openPlaceForm(${p.id})">✏️</button>
            <button class="admin-btn-icon" style="background:#fee2e2; color:#dc2626;" onclick="deletePlace(${p.id})">🗑️</button>
          </div>
        `).join('')}
      `;
    } 
    // 2. إدارة المحافظات والمناطق
    else if (tab === 'locations') {
      let html = `<div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:16px;">
        <h3 style="font-size:16px;">المحافظات (${db.governorates.length})</h3>
        <button class="btn-add" onclick="openGovForm()">+ إضافة محافظة</button>
      </div>`;
      
      db.governorates.forEach(gov => {
        html += `
          <div style="background:var(--surface); border:1px solid var(--border); border-radius:16px; padding:16px; margin-bottom:16px; box-shadow:var(--shadow);">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:12px;">
              <h4 style="font-weight:800; font-size:16px;">${gov.name}</h4>
              <div>
                <button class="admin-btn-icon" style="background:#e0e7ff; color:#4f46e5; width:32px; height:32px;" onclick="openDistForm('${gov.id}')">+</button>
                <button class="admin-btn-icon" style="background:#fee2e2; color:#dc2626; width:32px; height:32px;" onclick="deleteGov('${gov.id}')">🗑️</button>
              </div>
            </div>
            <div style="display:flex; flex-wrap:wrap; gap:8px;">
              ${gov.districts.map(d => `
                <span style="background:var(--bg); padding:6px 12px; border-radius:8px; font-size:13px; font-weight:600; border:1px solid var(--border); display:flex; align-items:center; gap:6px;">
                  ${d.name}
                  <span style="cursor:pointer; color:var(--danger); font-size:16px;" onclick="deleteDist('${gov.id}', '${d.id}')">&times;</span>
                </span>
              `).join('')}
            </div>
          </div>
        `;
      });
      container.innerHTML = html;
    }
    // 3. الإعدادات
    else if (tab === 'settings') {
      container.innerHTML = `
        <div style="background:white; padding:24px; border-radius:24px; border:1px solid var(--border); box-shadow:var(--shadow);">
          <h3 style="margin-bottom:20px; font-size:18px;">تغيير كلمة المرور</h3>
          <div class="form-group">
            <label>كلمة المرور الجديدة</label>
            <input type="text" id="newPassword" value="${db.password}">
          </div>
          <button class="btn-login" onclick="saveSettings()">حفظ الإعدادات</button>
        </div>
      `;
    }
  }

  function saveSettings() {
    const newPass = document.getElementById('newPassword').value;
    if (newPass.trim() === '') return alert('كلمة المرور لا يمكن أن تكون فارغة');
    db.password = newPass;
    saveDB();
    alert('تم حفظ كلمة المرور بنجاح');
  }

  /* ================= إدارة النوافذ (Modal) ================= */
  function closeModal() { document.getElementById('formModal').classList.remove('show'); }

  // فتح نموذج إضافة/تعديل منشأة
  function openPlaceForm(id = null) {
    editingPlaceId = id;
    const p = id ? db.places.find(x => x.id === id) : null;
    
    document.getElementById('modalTitle').textContent = p ? 'تعديل منشأة' : 'إضافة منشأة';
    
    // قائمة التصنيفات
    const catOptions = db.categories.map(c => `<option value="${c.id}" ${p && p.category === c.id ? 'selected' : ''}>${c.name}</option>`).join('');
    
    // قائمة المحافظات
    const govOptions = db.governorates.map(g => `<option value="${g.id}" ${p && p.govId === g.id ? 'selected' : ''}>${g.name}</option>`).join('');

    // قائمة المناطق (سنضعها مبدئياً وسنقوم بتحديثها بالجافاسكريبت)
    let distOptions = '';
    if (p) {
      const g = db.governorates.find(x => x.id === p.govId);
      if (g) {
        distOptions = g.districts.map(d => `<option value="${d.id}" ${p.distId === d.id ? 'selected' : ''}>${d.name}</option>`).join('');
      }
    } else if (db.governorates.length > 0) {
      // افتراضياً أول محافظة
      distOptions = db.governorates[0].districts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
    }

    document.getElementById('modalBody').innerHTML = `
      <div class="form-group">
        <label>اسم المنشأة</label>
        <input type="text" id="pName" value="${p ? p.name : ''}" placeholder="مثال: مطعم الشام">
      </div>
      <div class="form-group">
        <label>التصنيف</label>
        <select id="pCategory">${catOptions}</select>
      </div>
      <div class="form-group">
        <label>المحافظة</label>
        <select id="pGov" onchange="updateFormDistricts()">${govOptions}</select>
      </div>
      <div class="form-group">
        <label>المنطقة / المدينة</label>
        <select id="pDist">${distOptions}</select>
      </div>
      <div class="form-group">
        <label>الوصف</label>
        <textarea id="pDesc" rows="2" placeholder="وصف مختصر للمنشأة...">${p ? p.desc : ''}</textarea>
      </div>
      <div class="form-group">
        <label>رابط صورة المحل</label>
        <input type="url" id="pImage" value="${p ? p.image : ''}" placeholder="https://...jpg">
      </div>
      <div class="form-group">
        <label>رقم الواتساب</label>
        <input type="text" id="pWhatsapp" value="${p ? p.whatsapp : ''}" placeholder="963912345678">
      </div>
      <div class="form-group">
        <label>ساعات العمل</label>
        <input type="text" id="pHours" value="${p ? p.hours : ''}" placeholder="مثال: 9 ص - 11 م">
      </div>
      <div class="checkbox-group">
        <label><input type="checkbox" id="pIsOpen" ${p && p.isOpen ? 'checked' : ''}> مفتوح الآن</label>
        <label><input type="checkbox" id="pPremium" ${p && p.premium ? 'checked' : ''}> منشأة مميزة</label>
      </div>
      <button class="btn-login" style="margin-top:24px;" onclick="savePlace()">حفظ البيانات</button>
    `;
    
    document.getElementById('formModal').classList.add('show');
  }

  // تحديث المناطق داخل النموذج بناءً على المحافظة المختارة
  function updateFormDistricts() {
    const govId = document.getElementById('pGov').value;
    const gov = db.governorates.find(g => g.id === govId);
    const distSelect = document.getElementById('pDist');
    if (gov) {
      distSelect.innerHTML = gov.districts.map(d => `<option value="${d.id}">${d.name}</option>`).join('');
    } else {
      distSelect.innerHTML = '';
    }
  }

  function savePlace() {
    const name = document.getElementById('pName').value.trim();
    if (!name) return alert('اسم المنشأة مطلوب');

    const place = {
      id: editingPlaceId || Date.now(),
      name: name,
      category: document.getElementById('pCategory').value,
      govId: document.getElementById('pGov').value,
      distId: document.getElementById('pDist').value,
      desc: document.getElementById('pDesc').value,
      image: document.getElementById('pImage').value,
      whatsapp: document.getElementById('pWhatsapp').value,
      hours: document.getElementById('pHours').value,
      isOpen: document.getElementById('pIsOpen').checked,
      premium: document.getElementById('pPremium').checked,
      rating: editingPlaceId ? db.places.find(x => x.id === editingPlaceId).rating : 4.5
    };

    if (editingPlaceId) {
      const index = db.places.findIndex(x => x.id === editingPlaceId);
      db.places[index] = place;
    } else {
      db.places.unshift(place);
    }

    saveDB();
    closeModal();
    renderPlaces();
    renderAdmin('places');
    initLocationFilters(); // لتحديث القوائم المنسدلة
  }

  function deletePlace(id) {
    if (!confirm('هل أنت متأكد من حذف هذه المنشأة؟')) return;
    db.places = db.places.filter(x => x.id !== id);
    saveDB();
    renderPlaces();
    renderAdmin('places');
  }

  /* ================= إدارة المحافظات والمناطق (Admin) ================= */
  function openGovForm() {
    const name = prompt('اسم المحافظة الجديدة (مثال: إدلب):');
    if (name && name.trim() !== '') {
      db.governorates.push({
        id: 'gov_' + Date.now(),
        name: name.trim(),
        districts: []
      });
      saveDB();
      renderAdmin('locations');
      initLocationFilters();
    }
  }

  function deleteGov(govId) {
    const count = db.places.filter(p => p.govId === govId).length;
    if (count > 0) return alert(`لا يمكن حذف المحافظة لاحتوائها على ${count} منشأة. قم بنقل المنشآت أولاً.`);
    if (!confirm('هل تريد حذف هذه المحافظة وكل مناطقها؟')) return;
    db.governorates = db.governorates.filter(g => g.id !== govId);
    saveDB();
    renderAdmin('locations');
    initLocationFilters();
  }

  function openDistForm(govId) {
    const name = prompt('اسم المنطقة / المدينة الجديدة:');
    if (name && name.trim() !== '') {
      const gov = db.governorates.find(g => g.id === govId);
      if (gov) {
        gov.districts.push({
          id: 'dist_' + Date.now(),
          name: name.trim()
        });
        saveDB();
        renderAdmin('locations');
        initLocationFilters();
      }
    }
  }

  function deleteDist(govId, distId) {
    const count = db.places.filter(p => p.distId === distId).length;
    if (count > 0) return alert(`لا يمكن حذف المنطقة لاحتوائها على ${count} منشأة.`);
    if (!confirm('حذف هذه المنطقة؟')) return;
    const gov = db.governorates.find(g => g.id === govId);
    if (gov) {
      gov.districts = gov.districts.filter(d => d.id !== distId);
      saveDB();
      renderAdmin('locations');
      initLocationFilters();
    }
  }

  /* ================= التشغيل ================= */
  function init() {
    renderCategories();
    initLocationFilters();
    renderPlaces();
  }

  init();
</script>
</body>
</html>
